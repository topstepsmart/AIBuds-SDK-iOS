name: aibuds_live_stream_flutter
description: Flutter wrapper for AIBudsLiveStream player and streamer middleware.
version: 0.1.0
homepage: https://github.com/topstep-tech/aibuds-live-stream-flutter

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AIBudsLiveStreamFlutterPlugin

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
